services:
  - type: worker
    name: kilas-bot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m kilas.bot.main
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_PATH
        value: kilas.db

